description:
  en: 'Voice bridge between a XiaoAI (Xiaomi) speaker and DeepSeek Harness: hosts the local bridge process, turns wake word and speech recognition into a DSH conversation, and speaks the answer back through the speaker.'
  zh: '把小爱（小米）音箱接进 DeepSeek Harness 的语音桥：托管本地桥接器进程，把唤醒与语音识别接成 DSH 对话，再把答案用语音念回音箱。'
